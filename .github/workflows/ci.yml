name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · tests + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bank_aggregator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Non-secret CI placeholders — required for the app to import/configure.
      SECRET_KEY: ci-not-a-real-secret
      PLAID_CLIENT_ID: test
      PLAID_SECRET: test
      PLAID_ENV: sandbox
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bank_aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate ephemeral Fernet key
        run: echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Initialize database schema
        # The app provisions its schema via SQLAlchemy create_all at startup
        # (app/main.py). The Alembic chain has no initial create-tables
        # revision, so `alembic upgrade head` cannot build from an empty DB.
        # Mirror the app's real init here, then `stamp` so alembic_version is
        # coherent and the migration chain is validated as importable + linear.
        run: |
          python -c "from app.core.database import Base, engine; import app.models; Base.metadata.create_all(bind=engine)"
          alembic stamp head
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend · build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check & build
        run: npm run build
      - name: Lint
        run: npm run lint
