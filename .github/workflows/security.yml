name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so historical leaks are caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE only required for GitHub *organization* accounts.

  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "bandit[sarif]"
      - name: Bandit scan → SARIF (always uploads to Security tab)
        run: bandit -r app -f sarif -o "$GITHUB_WORKSPACE/bandit.sarif" --severity-level medium --exit-zero
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Bandit gate (fail on medium+ severity)
        run: bandit -r app -ll

  dependency-review:
    name: Dependency review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # Advisory: surfaces risky new deps in the PR. Requires the repo's
      # Dependency Graph (now enabled); kept non-blocking so graph-indexing
      # latency can't red the pipeline. pip-audit/npm audit + Dependabot also
      # cover dependency risk.
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  python-deps-audit:
    name: Python deps audit (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Advisory: surfaces CVEs without blocking unrelated PRs. Dependabot
      # opens the upgrade PRs; this keeps the backlog visible in the logs.
      - name: pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

  npm-audit:
    name: npm deps audit (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
